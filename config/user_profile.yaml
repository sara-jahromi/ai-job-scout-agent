# ==============================================================================
# Job Scout Matching Criteria & User Profile
# Edit this file to customize how the agent filters and ranks jobs.
# ==============================================================================

# Target Roles
target_roles:
  - "Machine Learning Engineer"
  - "ML Engineer"
  - "AI Research Engineer"
  - "Applied Scientist"
  - "Research Scientist"
  - "AI Engineer"

# Location Preferences
preferred_locations:
  - "San Francisco, CA"
  - "New York, NY"
  - "Seattle, WA"
  - "Boston, MA"
  
# Remote Preferences: Allowed values: "Remote", "Hybrid", "On-site"
remote_preference: "Remote"

# Keyword Filters
required_keywords:
  - "Python"
  - "PyTorch"
  

nice_to_have_keywords:
  - "Machine Learning"
  - "LLM"
  - "Generative AI"
  - "Transformers"
  - "Agentic AI"
  - "RAG"
  
avoid_keywords:
  - "Java"
  - "C#"
  - "Frontend"
  - "Web Developer"

# User Credentials
education:
  degree: "PhD"
  field: "Electrical Engineering"
  specialization: "Artificial Intelligence / Machine Learning"
  thesis_topic: "Reliable Machine Learning and Information Retrieval under Uncertainty"

skills:
  programming_languages:
    - "Python"
    - "Matlab"
    - "SQL"
  frameworks_libraries:
    - "PyTorch"
    - "Hugging Face"
    - "NumPy"
    - "Pandas"
    - "Scikit-Learn"
  ml_concepts:
    - "Deep Learning"
    - "Natural Language Processing (NLP)"
    - "Large Language Models (LLMs)"


experience_summary: >
  Machine Learning researcher with a Ph.D. in Electrical Engineering and experience developing robust decentralized learning, semantic retrieval, and AI/ML-driven network optimization methods. 
  First or corresponding author of research spanning information retrieval under token erasures, Byzantine-resilient distributed computation, and energy-aware 6G systems. 
  Combines mathematical modeling with hands-on implementation in Python, PyTorch, Hugging Face, and Gurobi.

# Minimum overall score required to trigger notifications (scale from 0.0 to 1.0)
minimum_match_score: 0.75
